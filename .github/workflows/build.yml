name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download JavaFX SDK
        run: |
          mkdir -p "$HOME/javafx"
          curl -sSL -o jfx.zip https://download2.gluonhq.com/openjfx/21.0.9/openjfx-21.0.9_linux-x64_bin-sdk.zip
          unzip -q jfx.zip -d "$HOME/javafx"

      - name: Compile
        run: ./build.sh
